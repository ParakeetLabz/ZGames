<style>
#loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b1e3a;transition:opacity .45s ease}
#loader.done{opacity:0;pointer-events:none}
.loader-bg{position:absolute;inset:-40%;background:radial-gradient(38% 32% at 30% 30%,rgba(59,130,246,.35),transparent 70%),radial-gradient(34% 30% at 70% 65%,rgba(139,92,246,.30),transparent 70%),radial-gradient(30% 26% at 55% 40%,rgba(34,211,238,.18),transparent 70%);filter:blur(10px);animation:bgdrift 9s ease-in-out infinite alternate}
@keyframes bgdrift{from{transform:translate3d(-4%,-3%,0) scale(1)}to{transform:translate3d(4%,3%,0) scale(1.12)}}
.loader-particles{position:absolute;inset:0;pointer-events:none}
.loader-particles i{position:absolute;bottom:-12px;width:6px;height:6px;border-radius:50%;background:rgba(147,197,253,.7);animation:rise linear infinite}
.loader-particles i:nth-child(1){left:12%;animation-duration:7s;animation-delay:0s}
.loader-particles i:nth-child(2){left:24%;animation-duration:9s;animation-delay:1.4s;width:4px;height:4px}
.loader-particles i:nth-child(3){left:38%;animation-duration:6s;animation-delay:.7s}
.loader-particles i:nth-child(4){left:52%;animation-duration:8s;animation-delay:2.1s;width:5px;height:5px}
.loader-particles i:nth-child(5){left:64%;animation-duration:7.5s;animation-delay:.3s}
.loader-particles i:nth-child(6){left:76%;animation-duration:6.5s;animation-delay:1.8s;width:4px;height:4px}
.loader-particles i:nth-child(7){left:86%;animation-duration:9.5s;animation-delay:1s}
.loader-particles i:nth-child(8){left:45%;animation-duration:8.5s;animation-delay:2.6s;width:3px;height:3px}
@keyframes rise{to{transform:translateY(-110vh);opacity:0}}
.loader-inner{position:relative;text-align:center}
.loader-zwrap{position:relative;display:inline-block;font:900 96px/1 system-ui,-apple-system,sans-serif;color:#fff;text-shadow:0 0 34px rgba(96,165,250,.85),0 10px 30px rgba(0,0,0,.45)}
.lz{display:inline-block;animation:zbounce 1.3s cubic-bezier(.45,0,.55,1) infinite}
.ghost{position:absolute;inset:0;pointer-events:none}
.ghost.g1{animation-delay:-.1s;opacity:.22}
.ghost.g2{animation-delay:-.2s;opacity:.1}
@keyframes zbounce{0%{transform:translateY(-38px) rotate(-8deg) scale(1,1)}45%{transform:translateY(-38px) rotate(8deg) scale(1,1)}50%{transform:translateY(10px) rotate(0deg) scale(1.18,.78)}60%{transform:translateY(-8px) rotate(-3deg) scale(.94,1.08)}100%{transform:translateY(-38px) rotate(-8deg) scale(1,1)}}
.loader-word{position:relative;margin-top:2px;transform-origin:top center;animation:wordsquash 1.3s cubic-bezier(.45,0,.55,1) infinite}
.loader-word span{display:inline-block;font:800 34px/1.2 system-ui,-apple-system,sans-serif;color:#fff;letter-spacing:4px;animation:letterwave 1.3s ease-in-out infinite}
.loader-word span:nth-child(1){animation-delay:0s}.loader-word span:nth-child(2){animation-delay:.08s}.loader-word span:nth-child(3){animation-delay:.16s}.loader-word span:nth-child(4){animation-delay:.24s}.loader-word span:nth-child(5){animation-delay:.32s}
@keyframes letterwave{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}}
@keyframes wordsquash{0%,40%{transform:scale(1,1)}50%{transform:scale(1.1,.68)}62%{transform:scale(.97,1.05)}75%,100%{transform:scale(1,1)}}
.burst{position:absolute;left:50%;top:20%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;opacity:0;animation:burst 1.3s ease-out infinite}
.burst i:nth-child(1){--dx:-52px;--dy:-34px;background:#ffd166}
.burst i:nth-child(2){--dx:-30px;--dy:-48px;background:#ef476f}
.burst i:nth-child(3){--dx:0px;--dy:-56px;background:#06d6a0}
.burst i:nth-child(4){--dx:30px;--dy:-48px;background:#118ab2}
.burst i:nth-child(5){--dx:52px;--dy:-34px;background:#c77dff}
.burst i:nth-child(6){--dx:-40px;--dy:-12px;background:#f78c6b}
.burst i:nth-child(7){--dx:40px;--dy:-12px;background:#7bf1a8}
.burst i:nth-child(8){--dx:0px;--dy:-26px;background:#ffde59}
@keyframes burst{0%,44%{transform:translate(0,0) scale(1);opacity:0}50%{transform:translate(calc(var(--dx)*.3),calc(var(--dy)*.3)) scale(1);opacity:1}58%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:1}80%,100%{transform:translate(calc(var(--dx)*1.4),calc(var(--dy)*1.4 + 14px)) scale(.3);opacity:0}}
.loader-shadow{width:120px;height:14px;margin:4px auto 0;background:radial-gradient(ellipse at center,rgba(0,0,0,.5),transparent 70%);border-radius:50%;animation:shadowp 1.3s cubic-bezier(.45,0,.55,1) infinite}
@keyframes shadowp{0%,40%{transform:scaleX(1.35);opacity:.3}50%{transform:scaleX(.7);opacity:.8}62%{transform:scaleX(1.1);opacity:.45}100%{transform:scaleX(1.35);opacity:.3}}
.loader-bar{width:150px;height:4px;margin:16px auto 0;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.loader-bar span{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#60a5fa,#a78bfa);animation:barslide 1.1s ease-in-out infinite}
@keyframes barslide{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
.loader-sub{margin-top:10px;font-size:12px;font-weight:700;letter-spacing:6px;color:rgba(255,255,255,.65)}
.loader-sub::after{content:'';animation:dots 1.2s steps(1) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style>

<div id="authModal" class="modal" hidden>
  <div class="modal-card">
    <button id="authClose" class="modal-x" aria-label="Close">×</button>
    <div id="authBody">
      <div id="authTabs" class="tabs">
        <button id="tabLogin" class="tab active" type="button">Log in</button>
        <button id="tabSignup" class="tab" type="button">Sign up</button>
      </div>
      <form id="formLogin">
        <label class="field">Username<input id="liUser" type="text" required autocomplete="username"></label>
        <label class="field">Password<input id="liPass" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <form id="formSignup" hidden>
        <label class="field">Username<input id="suUser" type="text" required maxlength="16" placeholder="3–16 chars, letters/numbers/_" autocomplete="username"></label>
        <label class="field">Password<input id="suPass" type="password" required placeholder="6+ characters" autocomplete="new-password"></label>
        <label class="field">Avatar (optional)<input id="suAvatar" type="file" accept="image/*"></label>
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>
      <div id="profileView" hidden></div>
      <p id="authMsg" class="hint"></p>
    </div>
  </div>
</div>

<div id="asbOverlay"></div>
<aside id="asbPanel" aria-label="Admin panel">
  <div class="asb-head">
    <h2>👑 Manage Games</h2>
    <button id="asbClose" class="asb-x" aria-label="Close">×</button>
  </div>
  <div class="asb-body">
    <h3 id="asbFormTitle" class="asb-sec" style="margin-top:0">➕ Add a game</h3>
    <form id="asbForm">
      <label class="field">Title<input id="asbTitle" type="text" required maxlength="60"></label>
      <label class="field">Category<input id="asbCat" type="text" placeholder="Arcade"></label>
      <label class="field">Description<input id="asbDesc" type="text" maxlength="140"></label>
      <label class="field">Tags — space or comma separated, no # needed<input id="asbTags" type="text" placeholder="beta multiplayer" maxlength="100"></label>
      <label class="field">Icon — image URL<input id="asbIconUrl" type="url" placeholder="https://…"></label>
      <label class="field">Icon — or upload image<input id="asbIconFile" type="file" accept="image/*"></label>
      <label class="field">Game URL (embedded)<input id="asbUrl" type="url" placeholder="https://…"></label>
      <label class="field">Game — or upload .html file<input id="asbGameFile" type="file" accept=".html,text/html"></label>
      <label class="field">Extra servers — one URL per line<textarea id="asbServers" rows="2" placeholder="https://backup-server…"></textarea></label>
      <button class="btn btn-primary" type="submit" id="asbSave">Add Game</button>
      <button class="btn btn-ghost" type="button" id="asbCancel" hidden>Cancel</button>
    </form>
    <div id="asbStatus" class="asb-status"></div>
    <h3 class="asb-sec">🎮 Games</h3>
    <div id="asbList"></div>
  </div>
</aside>
