<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hub Admin</title>
<style>
  :root { --bg:#040918; --panel:#0e1a3d; --line:#1e3a7a; --text:#e8f1ff;
    --muted:#8fa8d8; --blue:#1e90ff; --cyan:#00d4ff; --danger:#ff5470; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:680px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; margin-bottom:18px; }
  h2 { margin-bottom:14px; font-size:18px; }
  label { display:block; margin-bottom:12px; font-size:14px; font-weight:600; }
  input[type=text], input[type=url], input[type=password], textarea {
    width:100%; margin-top:6px; background:var(--bg); border:1px solid var(--line);
    color:var(--text); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; }
  input:focus, textarea:focus { border-color:var(--blue); }
  .hint { font-size:12px; color:var(--muted); font-weight:400; margin-top:6px; }
  .btn { border:none; cursor:pointer; border-radius:10px; padding:10px 18px;
    font-size:14px; font-weight:700; margin-right:8px; margin-top:4px; }
  .btn-p { background:linear-gradient(135deg,#0b5ed7,var(--blue)); color:#fff; }
  .btn-g { background:#142450; color:var(--text); border:1px solid var(--line); }
  .btn-d { background:rgba(255,84,112,.12); color:var(--danger); border:1px solid rgba(255,84,112,.4); }
  .row { display:flex; align-items:center; gap:12px; background:var(--bg);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .row img.thumb { width:48px; height:48px; border-radius:12px; object-fit:cover; }
  .row .fb { width:48px; height:48px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:22px; font-weight:800; color:#fff;
    background:linear-gradient(135deg,#0b5ed7,var(--cyan)); }
  .row-info { flex:1; min-width:0; }
  .row-title { font-weight:700; font-size:14px; }
  .row-sub { font-size:12px; color:var(--muted); word-break:break-all; }
  #status { font-size:13px; color:var(--cyan); margin-top:10px; min-height:18px; }
  #gate { text-align:center; padding-top:10vh; }
  #gate .panel { text-align:left; }
  #gate label { max-width:300px; margin-left:auto; margin-right:auto; }
  #gateMsg { text-align:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; }
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <div class="panel">
      <h2 style="text-align:center">🔒 Hub Admin</h2>
      <p class="hint" style="text-align:center">Sign in with your Z Games admin account</p>
      <label>Username<input id="liUser" type="text" autocomplete="username"></label>
      <label>Password<input id="liPass" type="password" autocomplete="current-password"></label>
      <div style="text-align:center"><button id="loginBtn" class="btn btn-p">Sign in</button></div>
      <p id="gateMsg" class="hint"></p>
    </div>
  </div>

  <div id="app" hidden>
    <div class="panel topbar">
      <div>
        <h2 style="margin-bottom:4px">👑 Hub Admin</h2>
        <p class="hint" id="whoLine" style="margin-top:0"></p>
      </div>
      <button id="logoutBtn" class="btn btn-g">Log out</button>
    </div>

    <div class="panel">
      <h2 id="formTitle">➕ Add a game</h2>
      <form id="gameForm">
        <div class="grid2">
          <label>Title<input id="fTitle" type="text" required maxlength="60"></label>
          <label>Category<input id="fCat" type="text" placeholder="Arcade"></label>
        </div>
        <label>Description<input id="fDesc" type="text" maxlength="140"></label>
        <label>Icon — image URL<input id="fIconUrl" type="url" placeholder="https://…"></label>
        <label>Icon — or upload image<input id="fIconFile" type="file" accept="image/*"></label>
        <label>Game URL (embedded)<input id="fUrl" type="url" placeholder="https://…"></label>
        <label>Game — or upload .html file<input id="fGameFile" type="file" accept=".html,text/html"></label>
        <label>Extra servers — one URL per line<textarea id="fServers" rows="2" placeholder="https://backup-server…"></textarea></label>
        <button class="btn btn-p" type="submit" id="saveBtn">Add Game</button>
        <button class="btn btn-g" type="button" id="cancelEdit" hidden>Cancel</button>
      </form>
      <div id="status"></div>
    </div>

    <div class="panel">
      <h2>🎮 Games</h2>
      <div id="gameList"></div>
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const setStatus = m => { $('status').textContent = m; };
const emailOf = u => u.trim().toLowerCase() + '@z-games.app';

const cfg = window.ZG_SUPABASE || {};
let sb = null;
if (cfg.url && cfg.anonKey && window.supabase) {
  sb = window.supabase.createClient(cfg.url, cfg.anonKey);
} else {
  $('gateMsg').textContent = 'Supabase is not connected on this site.';
}

/* ---------- login ---------- */
(async () => {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) checkAdmin(session.user);
})();

$('loginBtn').onclick = async () => {
  if (!sb) return;
  $('gateMsg').textContent = 'Signing in…';
  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email: emailOf($('liUser').value),
      password: $('liPass').value
    });
    if (error) throw new Error(error.message);
    await checkAdmin(data.user);
  } catch (e) { $('gateMsg').textContent = e.message || String(e); }
};
$('liPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

async function checkAdmin(user) {
  try {
    const { data, error } = await sb.from('profiles').select('username').eq('id', user.id).single();
    if (error) throw new Error(error.message);
    if ((data.username || '').toLowerCase() !== 'fun') {
      await sb.auth.signOut();
      $('gateMsg').textContent = 'This account is not an admin.';
      return;
    }
    $('whoLine').textContent = 'Signed in as @' + data.username + ' — changes go live instantly';
    $('gate').hidden = true;
    $('app').hidden = false;
    refresh();
  } catch (e) { $('gateMsg').textContent = 'Error: ' + (e.message || String(e)); }
}

$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- games ---------- */
let catalog = [], editingId = null;

async function refresh() {
  try {
    setStatus('Loading games…');
    const { data, error } = await sb.from('games').select('*').order('created_at');
    if (error) throw new Error(error.message);
    catalog = data || [];
    setStatus(`Loaded ${catalog.length} games ✓`);
  } catch (e) {
    catalog = [];
    setStatus('Error: ' + e.message +
      (String(e.message).includes('relation') ? ' — run supabase_games.sql in the Supabase SQL Editor first.' : ''));
  }
  renderList();
}

async function uploadAsset(path, file) {
  const { error } = await sb.storage.from('game-assets')
    .upload(path, file, { upsert: true, contentType: file.type || undefined });
  if (error) throw new Error(error.message);
  return sb.storage.from('game-assets').getPublicUrl(path).data.publicUrl;
}

function storagePath(url) {
  const m = String(url || '').match(/\/storage\/v1\/object\/public\/game-assets\/(.+)$/);
  return m ? m[1] : null;
}

function resetForm() {
  $('gameForm').reset();
  editingId = null;
  $('formTitle').textContent = '➕ Add a game';
  $('saveBtn').textContent = 'Add Game';
  $('cancelEdit').hidden = true;
}
$('cancelEdit').onclick = resetForm;

$('gameForm').onsubmit = async e => {
  e.preventDefault();
  const title = $('fTitle').value.trim();
  if (!title) return alert('Title needed');
  const url = $('fUrl').value.trim();
  const gameFile = $('fGameFile').files[0];
  const iconFile = $('fIconFile').files[0];
  if (!url && !gameFile) return alert('Add a game URL or upload an .html file.');
  const id = editingId || (title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') +
    '-' + Math.random().toString(36).slice(2, 6));
  try {
    setStatus('Working…');
    let icon = $('fIconUrl').value.trim();
    let kind = 'url', finalUrl = url;
    if (iconFile) {
      const ext = (iconFile.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
      icon = await uploadAsset(`icons/${id}.${ext}`, iconFile);
    }
    if (gameFile) {
      finalUrl = await uploadAsset(`games/${id}.html`, gameFile);
      kind = 'file';
    }
    const servers = $('fServers').value.split('\n').map(s => s.trim()).filter(Boolean)
      .map((u, i) => ({ name: 'Server ' + (i + 2), url: u }));
    const entry = {
      id, title,
      category: $('fCat').value.trim() || 'Other',
      description: $('fDesc').value.trim(),
      icon, kind, url: finalUrl, servers
    };
    const { error } = await sb.from('games').upsert(entry, { onConflict: 'id' });
    if (error) throw new Error(error.message);
    setStatus('Saved ✓ — live now');
    resetForm(); refresh();
  } catch (err) { setStatus('Error: ' + (err.message || String(err))); }
};

function thumb(g) {
  if (g.icon) return `<img class="thumb" src="${esc(g.icon)}" alt="">`;
  const ch = esc((g.title || '?').trim().charAt(0).toUpperCase() || '?');
  return `<div class="fb">${ch}</div>`;
}

function renderList() {
  if (!catalog.length) { $('gameList').innerHTML = '<p class="hint">No games yet.</p>'; return; }
  $('gameList').innerHTML = catalog.map(g => `
    <div class="row">${thumb(g)}
      <div class="row-info">
        <div class="row-title">${esc(g.title)}</div>
        <div class="row-sub">${esc(g.category || '')} · ${g.kind === 'file' ? 'uploaded' : 'link'}${(g.servers || []).length ? ' · ' + g.servers.length + ' servers' : ''} · ${esc(g.url)}</div>
      </div>
      <button class="btn btn-g" data-edit="${g.id}">Edit</button>
      <button class="btn btn-d" data-del="${g.id}">Delete</button>
    </div>`).join('');
  $('gameList').querySelectorAll('[data-edit]').forEach(b =>
    b.onclick = () => startEdit(b.dataset.edit));
  $('gameList').querySelectorAll('[data-del]').forEach(b =>
    b.onclick = async () => {
      const g = catalog.find(x => x.id === b.dataset.del);
      if (!g || !confirm(`Delete "${g.title}"?`)) return;
      try {
        setStatus('Deleting…');
        const paths = [storagePath(g.icon), storagePath(g.url)].filter(Boolean);
        if (paths.length) {
          const { error } = await sb.storage.from('game-assets').remove(paths);
          if (error) throw new Error(error.message);
        }
        const { error } = await sb.from('games').delete().eq('id', g.id);
        if (error) throw new Error(error.message);
        setStatus('Deleted ✓'); refresh();
      } catch (err) { setStatus('Error: ' + (err.message || String(err))); }
    });
}

function startEdit(id) {
  const g = catalog.find(x => x.id === id);
  if (!g) return;
  editingId = id;
  $('fTitle').value = g.title;
  $('fCat').value = g.category || '';
  $('fDesc').value = g.description || '';
  $('fIconUrl').value = g.icon || '';
  $('fUrl').value = g.url || '';
  $('fServers').value = (g.servers || []).map(s => typeof s === 'string' ? s : s.url).join('\n');
  $('formTitle').textContent = '✏️ Edit game';
  $('saveBtn').textContent = 'Save Changes';
  $('cancelEdit').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
