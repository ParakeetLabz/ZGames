<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Blend and Seek</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <!-- main menu -->
  <div id="menu" class="screen">
    <div class="panel">
      <h1>🦎 Blend <span class="amp">&</span> Seek</h1>
      <p class="tagline">Paint yourself. Blend in. Don't get found.</p>
      <label class="field">Your name<input id="nameInput" maxlength="16" placeholder="Player" autocomplete="off"></label>
      <label class="field">Room code <span class="hint-inline">(blank = new room)</span><input id="roomInput" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters"></label>
      <div class="form-actions">
        <button id="joinBtn" class="btn btn-primary">Play</button>
      </div>
      <p id="menuMsg" class="hint"></p>
      <div class="howto">
        <b>How it works</b>
        <p>🖌️ <b>Hiders</b> paint their bodies to match the arena, then hide.<br>
        🔍 <b>Seekers</b> hunt them down before time runs out.<br>
        Caught hiders become seekers!</p>
      </div>
    </div>
  </div>

  <!-- lobby -->
  <div id="lobby" class="screen" hidden>
    <div class="panel">
      <h2>Room <span id="lobbyCode" class="code"></span></h2>
      <p class="hint">Share the code with friends</p>
      <div id="lobbyList" class="plist"></div>
      <div class="form-actions">
        <button id="startBtn" class="btn btn-primary" hidden>Start game</button>
      </div>
      <p id="lobbyMsg" class="hint"></p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" hidden>
    <div id="timer" class="timer">0:00</div>
    <div id="roleBanner" class="role-banner"></div>
    <div id="phaseMsg" class="phase-msg" hidden></div>
    <div id="crosshair" hidden>+</div>
    <button id="tagBtn" class="tagbtn" hidden>TAG!</button>
    <div id="paintPanel" class="paint-panel" hidden>
      <div class="paint-title">🎨 Paint yourself</div>
      <div id="swatches" class="swatches"></div>
      <div class="paint-row">
        <input id="customColor" type="color" value="#ffffff" aria-label="Custom color">
        <div class="patbtns">
          <button data-pat="solid" class="patbtn active">Solid</button>
          <button data-pat="stripes" class="patbtn">Stripes</button>
          <button data-pat="spots" class="patbtn">Spots</button>
        </div>
      </div>
    </div>
    <div id="joy" class="joy" hidden><div id="stick" class="stick"></div></div>
    <div id="lookHint" class="hint look-hint" hidden>drag right side to look</div>
  </div>

  <!-- game over -->
  <div id="over" class="screen" hidden>
    <div class="panel">
      <h2 id="overTitle"></h2>
      <p id="overSub" class="hint"></p>
      <div class="form-actions">
        <button id="againBtn" class="btn btn-primary">Back to lobby</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
